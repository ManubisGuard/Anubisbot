[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anubis-bot-core"
version = "0.1.0"
description = "Independent multi-panel adapter core for MANUBIS"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pasarguard>=2.3.1", "cryptography>=42.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
